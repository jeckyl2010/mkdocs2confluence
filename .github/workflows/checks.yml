name: Checks

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # gitleaks needs full history
          persist-credentials: false  # no step here pushes; keep the token out of .git/config

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Dead code (vulture)
        run: uv run vulture src --min-confidence 80

      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      # Findings fail the job. Bandit writes the SARIF on exit 1 too, so the
      # upload below still runs; hashFiles guards the crash case (no file).
      # Needs the bandit[sarif] extra — plain bandit has no sarif formatter.
      - name: Security scan (bandit)
        run: uv run bandit -r src -ll -q -f sarif -o bandit.sarif

      - name: Upload Bandit results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: ${{ !cancelled() && hashFiles('bandit.sarif') != '' }}
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Complexity report (radon)
        continue-on-error: true
        run: |
          echo "## Cyclomatic Complexity (C and above)" >> "$GITHUB_STEP_SUMMARY"
          uv run radon cc src -a -n C --md >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false
