name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.10.3)"
        required: true

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      security-events: write
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gh CLI uses GH_TOKEN, uv publish uses OIDC — no git auth needed.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # This job holds id-token: write for PyPI. A cache restored from a
          # lower-trust context must not be able to influence what we publish.
          enable-cache: false

      - name: Build
        run: uv build -q

      - name: Compute artifact hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Uses the runner's built-in gh CLI rather than a third-party action, so no
      # external code runs in the job that can publish to PyPI.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/*.whl dist/*.tar.gz --generate-notes

      - name: Publish to PyPI
        run: uv publish

  provenance:
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    # Deliberately NOT pinned to a SHA, unlike every other action here: the SLSA
    # generator MUST be referenced by an exact @vX.Y.Z tag or slsa-verifier cannot
    # verify the trusted builder's ref. A SHA (or a short @vX tag) breaks provenance.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
